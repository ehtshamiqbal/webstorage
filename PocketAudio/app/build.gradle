plugins { id 'com.android.application' }
android {
    namespace 'com.pocketaudio.app'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'com.pocketaudio.app'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '6.0'
        testInstrumentationRunner 'com.pocketaudio.app.PlaybackChecks'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testBuildType 'release'
    buildTypes { debug { debuggable true }; release { debuggable false; minifyEnabled false; signingConfig signingConfigs.debug } }
}

dependencies {
 implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
 implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
