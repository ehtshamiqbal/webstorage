name: Verify compiled APK
on: [workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PocketAudio-APK
          run-id: 34359974756
          github-token: ${{ github.token }}
          path: PocketAudio/app/build/outputs/apk/debug
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          working-directory: PocketAudio
          disable-animations: true
          script: TEST_URL=https://www.youtube.com/watch?v=jNQXAC9IVRw python3 scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketAudio-Verification
          path: PocketAudio/smoke-results
