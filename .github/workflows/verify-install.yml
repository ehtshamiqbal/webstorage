name: Verify Android 10 release installation
on:
  pull_request:
    paths:
      - 'PocketAudio/scripts/verify_install.py'
      - '.github/workflows/verify-install.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PocketAudio-APK
          run-id: 34461041353
          github-token: ${{ github.token }}
          path: PocketAudio/app/build/outputs/apk/release
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          working-directory: PocketAudio
          disable-animations: true
          script: python3 scripts/verify_install.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android10-Install-Verification
          path: PocketAudio/install-results
